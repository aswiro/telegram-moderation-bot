[project]
name = "telegram-moderation-bot"
version = "0.1.0"
description = "Sanitized public showcase of a production-oriented Telegram group management bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.22.0",
    "aiogram-dialog>=2.4.0",
    "alembic>=1.17.2",
    "apscheduler>=3.11.1",
    "asyncpg>=0.31.0",
    "fluent-runtime>=0.4.0",
    "loguru>=0.7.3",
    "pydantic-settings>=2.12.0",
    "redis>=7.1.0",
    "sqlalchemy>=2.0.44",
]

[project.optional-dependencies]
dev = ["ruff"]
